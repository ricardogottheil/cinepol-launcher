name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
          - name: macOS x64
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf build-essential file

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        # The feature also lints the bindings tool, which the app build skips.
        run: cargo clippy --workspace --all-targets --features cinepol-launcher/export-bindings -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Typecheck (TypeScript 7)
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Frontend tests (Vitest)
        run: pnpm test

      - name: Release helper tests
        run: pnpm test:scripts

      - name: English-only check
        run: pnpm check:english

      - name: Bindings drift check
        shell: bash
        run: |
          pnpm bindings
          git diff --exit-code -- src/ipc/bindings.ts
          test -z "$(git status --porcelain -- src/ipc)"

      - name: Tauri build
        # Unsigned: signed, published builds come from release.yml (docs/release.md).
        run: pnpm tauri build
