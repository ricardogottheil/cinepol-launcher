[package]
name = "cinepol-launcher"
description = "Cinepol Launcher desktop shell (Tauri driving adapter)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
default-run = "cinepol-launcher"

[lib]
name = "cinepol_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
cinepol-launcher-core.workspace = true
tauri = { version = "2.12.4", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
ts-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["std"] }

[lints]
workspace = true
