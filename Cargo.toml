[workspace]
resolver = "3"
members = ["crates/launcher-core", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
authors = ["Ricardo Gottheil"]
repository = "https://github.com/ricardogottheil/cinepol-launcher"

[workspace.dependencies]
cinepol-launcher-core = { path = "crates/launcher-core" }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
ts-rs = "12.0.1"
uuid = { version = "1.28.0", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }
futures = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4.46"
regex-lite = "0.1.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tempfile = "3.27.0"
fastnbt = "2.6.3"
tauri-plugin-opener = "2.7.2"
# Pinned: native file pickers for .mrpack import and export, opened from Rust only.
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-updater = "=2.13.1"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
base64 = "0.22.1"
# Pinned: parses packwiz `pack.toml`, `index.toml` and `*.pw.toml` (no writer needed).
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
# `v1` selects the native stores: macOS Keychain, Windows Credential Manager, Linux Secret Service.
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
