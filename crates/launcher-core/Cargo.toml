[package]
name = "cinepol-launcher-core"
description = "Framework-free core of Cinepol Launcher: domain, use cases and adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "launcher_core"

[features]
# Integration tests that hit real external APIs. Never enabled by default.
network-tests = []
# In-memory fakes for every port, for tests in this and dependent crates.
test-support = []

[dependencies]
thiserror.workspace = true
uuid = { workspace = true, features = ["std", "v4", "serde"] }
md-5.workspace = true
tokio = { workspace = true, features = ["time", "fs", "process", "io-util", "net", "rt", "sync", "macros"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
futures.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
regex-lite.workspace = true
tracing.workspace = true
fastnbt.workspace = true
hickory-resolver.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tempfile.workspace = true

[lints]
workspace = true
