[package]
name = "cinepol-launcher-core"
description = "Framework-free core of Cinepol Launcher: domain, use cases and adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "launcher_core"

[features]
# Integration tests that hit real external APIs. Never enabled by default.
network-tests = []

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
